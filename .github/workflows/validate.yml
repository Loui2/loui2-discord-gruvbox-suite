name: Validate artifacts

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install pinned Chrome headless shell
        env:
          CHROME_HEADLESS_SHELL_URL: https://storage.googleapis.com/chrome-for-testing-public/149.0.7827.155/linux64/chrome-headless-shell-linux64.zip
          CHROME_HEADLESS_SHELL_SHA256: f9361a7b6390b4932d09a35796ec356e30dd7215fc231725098fd88563ae1fba
        run: |
          archive="$RUNNER_TEMP/chrome-headless-shell.zip"
          install_dir="$RUNNER_TEMP/chrome-headless-shell"
          curl --fail --location --silent --show-error "$CHROME_HEADLESS_SHELL_URL" --output "$archive"
          printf '%s  %s\n' "$CHROME_HEADLESS_SHELL_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "CHROMIUM_BIN=$install_dir/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Validate artifacts and syntax
        run: python3 scripts/validate.py
      - name: Run userscript regression and browser tests
        run: |
          python3 tests/loui2-discord-web-suite-regression.py
          node --test tests/loui2-discord-web-suite-delete-companion.mjs
          node --test tests/loui2-discord-web-suite-delete-ui.mjs
          node --test tests/loui2-discord-web-suite-dom-only-export.mjs
